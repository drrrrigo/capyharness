[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-harness"
version = "0.1.0"
description = "An incremental, educational harness for software development agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aih = "aih.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
