[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capyharness"
version = "0.1.0"
description = "A developer-focused AI agent harness built incrementally and openly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
capyh = "capyharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
